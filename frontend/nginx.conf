server {
  listen 80;
  server_name _;

  if ($http_x_forwarded_proto = http) {
    return 308 https://$host$request_uri;
  }

  root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Conserver le contrôle de santé public déjà utilisé par le NAS.
    location = /health {
        proxy_pass http://ontime-backend:3000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Le navigateur utilise des URL relatives; nginx est l'unique porte
    # d'entrée et transmet les appels applicatifs au réseau Docker privé.
    location /api/ {
        proxy_pass http://ontime-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
