server {
  listen 80;
  server_name _;
  server_tokens off;
  # Le seul client direct est le proxy DSM, joint par la passerelle du réseau
  # Docker. nginx peut donc restaurer l'adresse publique sans faire confiance
  # à une valeur X-Forwarded-For fournie directement par Internet.
  set_real_ip_from 172.20.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

  if ($http_x_forwarded_proto = http) {
    return 308 https://$host$request_uri;
  }

  root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Conserver le contrôle de santé public déjà utilisé par le NAS.
    location = /health {
        proxy_pass http://ontime-backend:3000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Le navigateur utilise des URL relatives; nginx est l'unique porte
    # d'entrée et transmet les appels applicatifs au réseau Docker privé.
    location /api/ {
        proxy_pass http://ontime-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
